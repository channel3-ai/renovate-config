name: Validate Renovate config

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Renovate config files
        run: npx --yes --package renovate@latest -- renovate-config-validator --strict default.json org-inherited-config.json
